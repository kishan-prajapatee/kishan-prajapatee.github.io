<style>
:root{
  --page:#8EA6F7; --board:#000; --orange:#FF6A00; --orange-2:#FF7F24; --sky:#9DB8F8; --sky-2:#B4C9FA;
  --card:#FFFFFF; --ink:#16161A; --muted:#5B5F6B; --green:#1E9E4A; --green-soft:#E3F5EA; --pill-border:#FFB27A;
  --circle:rgba(255,255,255,.14); --shadow:0 6px 18px rgba(0,0,0,.12);
  --display:"Unbounded","Arial Black","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --r-tile:26px; --r-card:16px; --gap:16px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#1C2347; --sky:#5E78C9; --sky-2:#6F88D6; --card:#F4F6FB; --circle:rgba(255,255,255,.08);
}}
:root[data-theme="dark"]{--page:#1C2347; --sky:#5E78C9; --sky-2:#6F88D6; --card:#F4F6FB; --circle:rgba(255,255,255,.08)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:8px}
.card :focus-visible,dialog :focus-visible{outline-color:var(--ink)}

/* Page title (the big wide wordmark) */
.masthead{max-width:1240px;margin:0 auto;padding:40px 24px 28px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.masthead h1{font-family:var(--display);font-weight:800;color:#fff;font-size:clamp(34px,6.4vw,84px);line-height:.95;letter-spacing:-.01em;margin:0;text-transform:uppercase}
.masthead p{margin:10px 0 0;color:#fff;font-size:18px;font-weight:500;opacity:.95}
.top-actions{display:flex;gap:10px;align-items:center;margin-left:auto;align-self:flex-start}
.theme{width:44px;height:44px;border-radius:14px;border:0;background:var(--board);cursor:pointer;display:grid;place-items:center}
.theme::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid #fff;background:linear-gradient(90deg,#fff 50%,transparent 50%)}

/* The black board */
.board{max-width:1240px;margin:0 auto 40px;background:var(--board);border-radius:32px;padding:var(--gap);
  display:grid;gap:var(--gap);grid-template-columns:1.05fr 1fr 1fr 1.05fr;
  grid-template-areas:
   "hero now week work"
   "hero chart chart work"
   "flow chart chart work"
   "flow award places contact"
   "skills skills skills skills";
}
.tile{position:relative;overflow:hidden;border-radius:var(--r-tile);padding:26px;min-width:0;isolation:isolate}
.tile.o{background:var(--orange);color:#fff}
.tile.b{background:var(--sky);color:var(--ink)}
.tile.w{background:var(--card);color:var(--ink)}
.tile .ring{position:absolute;z-index:-1;border-radius:50%;background:var(--circle);pointer-events:none}
.t-title{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15;margin:0 0 14px;letter-spacing:-.01em}
.t-note{font-size:13px;font-weight:600;opacity:.9;margin:0 0 12px}
.card{background:var(--card);color:var(--ink);border-radius:var(--r-card);box-shadow:var(--shadow)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--green-soft);color:var(--green)}
.tag::before{content:"";width:7px;height:7px;border-radius:2px;border:1.5px solid var(--green)}

/* HERO */
.hero{grid-area:hero;display:flex;flex-direction:column;justify-content:space-between;min-height:560px}
.hero .ring.a{width:420px;height:420px;right:-170px;top:-120px}
.hero .ring.b{width:300px;height:300px;left:-120px;bottom:-110px}
.avatar{width:160px;height:160px;border-radius:50%;background:#fff;color:var(--orange);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px;box-shadow:0 0 0 8px rgba(255,255,255,.22);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.status{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;margin-top:22px;align-self:flex-start}
.status i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.hero h2{font-family:var(--display);font-weight:800;font-size:clamp(30px,3vw,40px);line-height:1.02;margin:0 0 8px}
.hero .role{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 14px}
.hero .stack{font-size:16px;font-weight:600;margin:0 0 22px;opacity:.95}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;border:2px solid transparent}
.btn.dark{background:var(--ink);color:#fff}
.btn.white{background:#fff;color:var(--ink)}
.btn.line{background:transparent;color:#fff;border-color:#fff}
.btn.orange{background:var(--orange);color:#fff}
.btn.line-o{background:#fff;color:#C24F00;border-color:var(--pill-border)}

/* NOW (phone frame) */
.now{grid-area:now;padding:22px 22px 0;display:flex;justify-content:center;align-items:flex-end;min-height:260px}
.now .ring{width:280px;height:280px;left:-60px;top:-80px}
.phone{width:100%;max-width:230px;background:#fff;border:7px solid #111;border-bottom:0;border-radius:30px 30px 0 0;padding:16px 14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.phone .notch{width:70px;height:6px;border-radius:9px;background:#111;margin:-6px auto 12px}
.phone h3{font-family:var(--display);font-size:13px;margin:8px 0 10px}
.phone .row{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #EEF0F4;padding:8px 0}
.phone .row b{font-family:var(--display);font-size:20px;color:var(--orange)}
.phone .row span{font-size:12px;color:var(--muted);text-align:right;max-width:60%}

/* WEEK (notifications) */
.week{grid-area:week;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:260px}
.week .ring{width:260px;height:260px;right:-90px;bottom:-110px}
.toast{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start;background:rgba(40,52,90,.78);color:#fff;border-radius:14px;padding:12px;backdrop-filter:blur(6px)}
.toast .ic{width:36px;height:36px;border-radius:10px;background:var(--orange);display:grid;place-items:center}
.toast b{display:block;font-size:13px}
.toast span{display:block;font-size:12.5px;opacity:.9;line-height:1.35}
.toast small{font-size:10px;opacity:.75;white-space:nowrap;font-weight:600}
.toast:nth-child(3){margin:0 10px}
.toast:nth-child(4){margin:0 20px;opacity:.9}

/* CHART */
.chart{grid-area:chart;display:flex;flex-direction:column;min-height:420px}
.chart .water{position:absolute;right:-6px;top:14px;z-index:-1;font-family:var(--display);font-weight:800;font-size:clamp(60px,8vw,112px);line-height:.9;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.16);text-align:right;pointer-events:none;white-space:nowrap}
.chart .big{font-family:var(--display);font-weight:800;font-size:clamp(40px,4.4vw,58px);line-height:1;margin:2px 0 6px}
.chart .sub{font-size:15px;font-weight:600;margin:0}
.legend{display:flex;gap:16px;margin:14px 0 0;font-size:13px;font-weight:700}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.bars{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:end;margin-top:18px;min-height:200px}
.bar{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:100%;background:none;border:0;padding:0;cursor:pointer;color:#fff}
.stack-col{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;height:100%}
.seg{border-radius:14px 14px 10px 10px;transform-origin:bottom;animation:grow .9s cubic-bezier(.3,.7,.2,1) both}
.seg.g{background:#fff}.seg.r{background:var(--sky)}
.bar:nth-child(2) .seg{animation-delay:.08s}.bar:nth-child(3) .seg{animation-delay:.16s}.bar:nth-child(4) .seg{animation-delay:.24s}.bar:nth-child(5) .seg{animation-delay:.32s}
@keyframes grow{from{transform:scaleY(0)}}
.bar .yr{font-weight:700;font-size:15px;margin-top:8px;text-align:center}
.bar .mo{font-size:11px;font-weight:600;opacity:.9;text-align:center}
.bar:hover .seg{filter:brightness(.95)}

/* WORK (menu cards) */
.work{grid-area:work;display:flex;flex-direction:column}
.work .ring{width:360px;height:360px;right:-160px;top:180px}
.work-list{display:flex;flex-direction:column;gap:14px}
.wcard{display:grid;grid-template-columns:1fr 78px;gap:10px;padding:14px;position:relative}
.wcard h3{font-size:14px;font-weight:700;margin:8px 0 4px;line-height:1.25}
.wcard p{font-size:12.5px;color:var(--muted);margin:0 0 4px;line-height:1.4}
.wcard .from{font-size:12px;font-weight:700;color:var(--ink)}
.thumb{width:78px;height:78px;border-radius:12px;display:grid;place-items:center;background:#FFF1E6}
.thumb svg{width:40px;height:40px}
.wcard .open{position:absolute;right:14px;bottom:-12px;min-height:30px;padding:0 14px;border-radius:9px;font-size:12px;font-weight:800;background:#fff;color:#C24F00;border:1.5px solid var(--pill-border);cursor:pointer}
.wcard .open::after{content:"+";margin-left:6px}
.wcard{margin-bottom:6px}

/* FLOW (how I work chips) */
.flow{grid-area:flow;display:flex;flex-direction:column;min-height:420px}
.flow .ring.a{width:330px;height:330px;left:50%;top:52%;transform:translate(-50%,-50%);background:rgba(255,255,255,.22)}
.flow .ring.b{width:210px;height:210px;left:50%;top:52%;transform:translate(-50%,-50%);background:rgba(255,255,255,.25)}
.chips{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--orange);border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;box-shadow:var(--shadow);align-self:flex-start}
.chip:nth-child(2){margin-left:14%}.chip:nth-child(3){margin-left:28%}.chip:nth-child(4){margin-left:10%}.chip:nth-child(5){margin-left:24%}
.chip .n{font-size:11px;color:var(--muted);font-weight:700}
.flow .foot{font-size:14px;font-weight:600;margin:12px 0 0}

/* AWARD */
.award{grid-area:award}
.award .ring{width:260px;height:260px;left:-100px;bottom:-140px}
.rev{padding:14px}
.rev .who{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.rev .who b{font-size:14px}
.stars{background:var(--green);color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px}
.rev p{margin:0 0 10px;font-size:13px;color:#33363F;line-height:1.45}
.meter{height:6px;border-radius:9px;background:#E6E8EE;overflow:hidden}.meter i{display:block;height:100%;width:100%;background:var(--green)}
.cert{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.cert .badge{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--orange);font-family:var(--display);font-size:10px}

/* PLACES (country pills) */
.places{grid-area:places;min-height:250px}
.places .ring{width:220px;height:220px;right:-80px;top:-80px}
.pills{display:flex;flex-wrap:wrap;gap:14px 10px;margin-top:6px}
.pill{position:relative;background:#fff;border:1.5px solid var(--pill-border);color:#C24F00;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700}
.pill sup{position:absolute;top:-10px;right:-8px;background:var(--orange);color:#fff;font-size:10px;font-weight:800;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--sky)}
.pulse{position:absolute;left:24px;bottom:22px;width:18px;height:18px;border-radius:50%;background:var(--green);box-shadow:0 0 0 7px rgba(30,158,74,.25),0 0 0 14px rgba(30,158,74,.12)}
.places .key{position:absolute;left:54px;bottom:20px;font-size:12px;font-weight:700;right:16px}

/* CONTACT (map) */
.contact{grid-area:contact;padding:0;min-height:250px;background:#EEF1F6}
.map{position:absolute;inset:0;z-index:-1}
.contact .inner{position:relative;padding:22px;height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.contact .t-title{color:var(--ink)}
.eta{align-self:center;display:inline-flex;gap:6px;align-items:center;background:rgba(22,22,26,.85);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px}
.pin{position:absolute;left:52%;top:40%;width:26px;height:26px;background:var(--orange);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 4px 10px rgba(255,106,0,.4)}
.pin::after{content:"";position:absolute;inset:8px;background:#fff;border-radius:50%}
.copied{font-size:12px;font-weight:700;color:var(--green);min-height:18px}

/* SKILLS */
.skills{grid-area:skills;display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
.skills .ring{width:300px;height:300px;left:-120px;top:-150px}
.sk-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.sk h3{margin:0 0 8px;font-size:13px;font-weight:800}
.sk ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.sk li{background:#fff;color:var(--ink);font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:8px}
.skills .t-title{font-size:26px}
.skills .foot{font-size:13px;font-weight:600;margin:0}

/* Dialog */
dialog{border:0;padding:0;border-radius:24px;max-width:min(720px,calc(100vw - 24px));width:100%;max-height:calc(100vh - 40px);background:#fff;color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,40,.55);backdrop-filter:blur(3px)}
.dlg-head{background:var(--orange);color:#fff;padding:26px 28px 22px;position:relative}
.dlg-head h2{font-family:var(--display);font-size:clamp(20px,3vw,26px);line-height:1.15;margin:8px 0 6px}
.dlg-head p{margin:0;font-size:14px;font-weight:600}
.dlg-head .tag{background:#fff}
.x{position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer;line-height:1}
.dlg-body{padding:24px 28px 28px;display:grid;gap:20px;overflow:auto}
.dlg-body h3{font-size:13px;font-weight:800;margin:0 0 6px;color:#C24F00}
.dlg-body p,.dlg-body li{font-size:15.5px;line-height:1.55;margin:0}
.dlg-body ul{margin:0;padding-left:20px}.dlg-body li{margin-bottom:6px}
.dlg-tags{display:flex;flex-wrap:wrap;gap:6px}
.dlg-tags span{background:#FFF1E6;color:#8A3A00;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:8px}

footer{max-width:1240px;margin:0 auto;padding:0 24px 40px;color:#fff;font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Responsive */
@media (max-width:1080px){
  .board{grid-template-columns:1fr 1fr;grid-template-areas:
   "hero work" "hero work" "now week" "chart chart" "flow award" "flow places" "contact contact" "skills skills"}
  .hero{min-height:520px}
}
@media (max-width:640px){
  :root{--gap:12px}
  .masthead{padding:28px 16px 20px}
  .board{border-radius:24px;margin:0 10px 28px;grid-template-columns:1fr;grid-template-areas:"hero" "now" "work" "chart" "places" "week" "flow" "award" "contact" "skills"}
  .tile{padding:22px}
  .hero{min-height:0;gap:26px}
  .skills{grid-template-columns:1fr}
  .bars{gap:8px}
  .chip{margin-left:0!important}
  footer{padding:0 16px 32px}
}
@media (prefers-reduced-motion:reduce){.seg{animation:none}html{scroll-behavior:auto}}

/* ============ Motion ============ */
/* Only when JS is running, so content is never hidden without it */
.js .tile{opacity:0;transform:translateY(16px) scale(.985);transition:opacity .6s ease,transform .75s cubic-bezier(.2,.75,.2,1);transition-delay:var(--d,0ms)}
.js .tile.in{opacity:1;transform:none}
/* Chart: bars wait until the tile is on screen */
.js .seg{animation-play-state:paused}
.js .chart.in .seg{animation-play-state:running}
/* Notifications arrive one by one */
.js .toast{opacity:0;transform:translateY(12px) scale(.97)}
.js .week.in .toast{animation:toastIn .5s cubic-bezier(.2,.8,.2,1) forwards}
.js .week.in .toast:nth-of-type(1){animation-delay:.35s}
.js .week.in .toast:nth-of-type(2){animation-delay:.75s}
.js .week.in .toast:nth-of-type(3){animation-delay:1.15s}
@keyframes toastIn{to{opacity:1;transform:none}}
/* How-I-work chips pop in sequence */
.js .chip{opacity:0;transform:translateX(-10px)}
.js .flow.in .chip{animation:chipIn .45s cubic-bezier(.2,.8,.2,1) forwards}
.js .flow.in .chip:nth-child(1){animation-delay:.2s}.js .flow.in .chip:nth-child(2){animation-delay:.32s}
.js .flow.in .chip:nth-child(3){animation-delay:.44s}.js .flow.in .chip:nth-child(4){animation-delay:.56s}
.js .flow.in .chip:nth-child(5){animation-delay:.68s}
@keyframes chipIn{to{opacity:1;transform:none}}
/* Map pin drops once */
.js .contact.in .pin{animation:pinDrop .7s .3s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pinDrop{from{opacity:0;transform:translateY(-26px) rotate(-45deg)}to{opacity:1;transform:rotate(-45deg)}}
/* Live-status dots breathe (the only looping motion) */
.status i,.pulse{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 4px rgba(30,158,74,.25),0 0 0 8px rgba(30,158,74,0)}50%{box-shadow:0 0 0 6px rgba(30,158,74,.28),0 0 0 14px rgba(30,158,74,.10)}}
/* Interaction feedback */
.btn{transition:transform .18s ease,box-shadow .18s ease,opacity .18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.18);opacity:1}
.btn:active{transform:translateY(0) scale(.98)}
.wcard{transition:transform .22s ease,box-shadow .22s ease}
.wcard:hover,.wcard:focus-within{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.16)}
.wcard .thumb svg{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.wcard:hover .thumb svg{transform:scale(1.12) rotate(-4deg)}
.wcard .open{transition:background .18s,color .18s}
.wcard .open:hover{background:var(--orange);color:#fff}
.bar .seg{transition:filter .2s,transform .2s}
.bar:hover .seg,.bar:focus-visible .seg{filter:brightness(1.06);transform:scaleY(1.03)}
.avatar{transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.hero:hover .avatar{transform:rotate(-3deg) scale(1.03)}
/* Dialog */
dialog[open]{animation:dlgIn .32s cubic-bezier(.2,.8,.2,1)}
dialog[open]::backdrop{animation:fadeIn .25s ease}
@keyframes dlgIn{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes fadeIn{from{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .js .tile,.js .toast,.js .chip{opacity:1!important;transform:none!important;transition:none!important;animation:none!important}
  .seg,.pin,.status i,.pulse,dialog[open],dialog[open]::backdrop{animation:none!important}
  .btn,.wcard,.bar .seg,.avatar,.wcard .thumb svg{transition:none!important}
  .btn:hover,.wcard:hover,.hero:hover .avatar,.wcard:hover .thumb svg{transform:none!important}
}
</style>
</head>
<body>
<script>document.documentElement.classList.add("js")</script>
<header class="masthead">
  <div><h1 id="mast"></h1><p id="mast-sub"></p></div>
  <div class="top-actions"><button class="theme" id="theme" aria-label="Switch light or dark theme" title="Switch theme"></button></div>
</header>

<main class="board" id="board">
  <section class="tile o hero" aria-labelledby="h-name">
    <span class="ring a"></span><span class="ring b"></span>
    <div><div class="avatar" id="avatar"></div><div class="status" id="status"><i></i><span></span></div></div>
    <div>
      <h2 id="h-name"></h2>
      <p class="role" id="h-role"></p>
      <p class="stack" id="h-stack"></p>
      <div class="btns" id="h-btns"></div>
    </div>
  </section>

  <section class="tile b now" aria-label="Most recent role in numbers"><span class="ring"></span>
    <div class="phone" id="phone"></div>
  </section>

  <section class="tile b week" aria-labelledby="week-t"><span class="ring"></span>
    <p class="t-note" id="week-t"></p>
    <div id="toasts" style="display:contents"></div>
  </section>

  <section class="tile o chart" aria-labelledby="chart-t">
    <span class="water" aria-hidden="true">FULL<br>STACK</span>
    <h2 class="t-title" id="chart-t">Career timeline</h2>
    <div class="big" id="chart-big"></div>
    <p class="sub" id="chart-sub"></p>
    <div class="legend" id="legend"></div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="tile o work" id="work" aria-labelledby="work-t"><span class="ring"></span>
    <h2 class="t-title" id="work-t">Selected work</h2>
    <div class="work-list" id="cases"></div>
  </section>

  <section class="tile b flow" aria-labelledby="flow-t"><span class="ring a"></span><span class="ring b"></span>
    <h2 class="t-title" id="flow-t">How I work</h2>
    <div class="chips" id="chips"></div>
    <p class="foot" id="flow-foot"></p>
  </section>

  <section class="tile o award" aria-labelledby="award-t"><span class="ring"></span>
    <h2 class="t-title" id="award-t">Recognition</h2>
    <div id="award"></div>
  </section>

  <section class="tile b places" aria-labelledby="places-t"><span class="ring"></span>
    <h2 class="t-title" id="places-t"></h2>
    <div class="pills" id="pills"></div>
    <span class="pulse" aria-hidden="true"></span><span class="key" id="pill-key"></span>
  </section>

  <section class="tile contact" id="contact" aria-labelledby="contact-t">
    <svg class="map" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect width="400" height="260" fill="#EEF1F6"/>
      <g fill="#DDE7D6"><rect x="24" y="150" width="70" height="46" rx="8"/><rect x="286" y="30" width="80" height="40" rx="8"/></g>
      <g stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"><path d="M-10 70 L420 40"/><path d="M40 -10 L120 280"/><path d="M-10 190 C120 170 250 220 420 150"/><path d="M260 -10 L230 280"/></g>
      <g stroke="#F6C77A" stroke-width="5" fill="none" stroke-linecap="round"><path d="M-10 120 C100 110 180 90 420 105"/><path d="M330 -10 C320 90 340 180 300 280"/></g>
      <path d="M60 230 C150 200 190 150 208 112" stroke="#1E9E4A" stroke-width="4" fill="none" stroke-dasharray="2 8" stroke-linecap="round"/>
    </svg>
    <span class="pin" aria-hidden="true"></span>
    <div class="inner">
      <div><h2 class="t-title" id="contact-t">Get in touch</h2><span class="eta" id="eta"></span></div>
      <div><div class="btns" id="c-btns"></div><div class="copied" id="copied" role="status" aria-live="polite"></div></div>
    </div>
  </section>

  <section class="tile o skills" id="skills" aria-labelledby="skills-t"><span class="ring"></span>
    <div><h2 class="t-title" id="skills-t">Skills</h2><p class="foot" id="sk-foot"></p></div>
    <div class="sk-groups" id="sk"></div>
  </section>
</main>

<footer><span id="f-left"></span><span id="f-right"></span></footer>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head"><button class="x" id="dlg-x" aria-label="Close">×</button><div id="dlg-head"></div></div>
  <div class="dlg-body" id="dlg-body"></div>
</dialog>

  P.latest.rows.map(([n,l]) => `<div class="row"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("");

// Toasts
$("#week-t").textContent = P.weekTitle;
const pinSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>`;
$("#toasts").innerHTML = P.toasts.map(([b,s,t]) => `<div class="toast"><span class="ic">${pinSvg}</span><div><b>${esc(b)}</b><span>${esc(s)}</span></div><small>${esc(t)}</small></div>`).join("");

// Chart
const totalMonths = P.years.reduce((a,y)=>a+y.g+y.r,0);
const yrs = Math.floor(totalMonths/12), mos = totalMonths%12;
$("#chart-big").textContent = `${yrs}y ${mos}m`;
$("#chart-sub").textContent = `${P.roles.length} roles · 2 employers · Nov 2022 – Oct 2026`;
$("#legend").innerHTML = `<span><i style="background:#fff"></i>${esc(P.employers.g)}</span><span><i style="background:var(--sky)"></i>${esc(P.employers.r)}</span>`;
$("#bars").innerHTML = P.years.map(y => {
  const pct = v => (v/12*100).toFixed(1) + "%";
  return `<button class="bar" type="button" data-year="${esc(y.year)}" aria-label="${esc(y.year)}: ${y.g+y.r} months worked. Open details">
    <div class="stack-col">${y.r ? `<div class="seg r" style="height:${pct(y.r)}"></div>` : ""}${y.g ? `<div class="seg g" style="height:${pct(y.g)}"></div>` : ""}</div>
    <span class="yr">${esc(y.year)}</span><span class="mo">${y.g+y.r} mo</span></button>`;
}).join("");

// Work cards
const thumbs = {
  lock:`<svg viewBox="0 0 24 24" fill="none" stroke="#FF6A00" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg>`,
  sync:`<svg viewBox="0 0 24 24" fill="none" stroke="#FF6A00" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/></svg>`,
  tree:`<svg viewBox="0 0 24 24" fill="none" stroke="#FF6A00" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="5" rx="1.5"/><rect x="3" y="16" width="6" height="5" rx="1.5"/><rect x="15" y="16" width="6" height="5" rx="1.5"/><path d="M12 8v4M6 16v-4h12v4"/></svg>`,
  chart:`<svg viewBox="0 0 24 24" fill="none" stroke="#FF6A00" stroke-width="2" stroke-linecap="round"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg>`
};
$("#cases").innerHTML = P.cases.map(c => `
  <article class="card wcard">
    <div><span class="tag">${esc(c.from)}</span><h3>${esc(c.title)}</h3><p>${esc(c.blurb)}</p></div>
    <div class="thumb">${thumbs[c.thumb] || ""}</div>
    <button class="open" type="button" data-case="${esc(c.id)}" aria-label="Open case study: ${esc(c.title)}">Open</button>
  </article>`).join("");

// Flow chips
$("#chips").innerHTML = P.flow.map(([e,t],i) => `<span class="chip"><span aria-hidden="true">${e}</span>${esc(t)}<span class="n">${i+1}/${P.flow.length}</span></span>`).join("");
$("#flow-foot").textContent = P.flowFoot;

// Award
$("#award").innerHTML = `<div class="card rev"><div class="who"><b>${esc(P.award.title)}</b><span class="stars">★ Award</span></div>
  <p>${esc(P.award.text)}</p></div>
  ${P.award.cert ? `<div class="cert"><span class="badge">MS</span><span>${esc(P.award.cert)}</span></div>` : ""}`;

// Countries
$("#places-t").textContent = P.countriesTitle;
$("#pills").innerHTML = P.countries.map(([c,k]) => `<span class="pill">${esc(c)}<sup title="${esc(P.employers[k])}">${k.toUpperCase()}</sup></span>`).join("");
$("#pill-key").textContent = `G = ${P.employers.g} · R = ${P.employers.r}`;

// Contact
$("#eta").innerHTML = P.replyNote ? `🕑 ${esc(P.replyNote)}` : ""; if (!P.replyNote) hide($("#eta"));
$("#c-btns").innerHTML = [
  P.email && `<a class="btn orange" href="mailto:${esc(P.email)}?subject=${encodeURIComponent("Opportunity for " + P.name)}">Email me</a>`,
  P.email && `<button class="btn dark" type="button" id="copy">Copy email</button>`,
  P.phone && `<a class="btn line-o" href="tel:${esc(P.phone.replace(/\s/g,""))}">Call</a>`,
  P.github && `<a class="btn line-o" ${ext(P.github)}>GitHub</a>`
].filter(Boolean).join("");
const cp = $("#copy");
if (cp) cp.onclick = async () => {
  try { await navigator.clipboard.writeText(P.email); $("#copied").textContent = `Copied ${P.email}`; }
  catch { $("#copied").textContent = P.email; }
  setTimeout(() => $("#copied").textContent = "", 3500);
};

// Skills
$("#sk").innerHTML = P.skills.map(([h,list]) => `<div class="sk"><h3>${esc(h)}</h3><ul>${list.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`).join("");
$("#sk-foot").textContent = P.skillsFoot;

$("#f-left").textContent = `${P.name} · ${P.location}`;
$("#f-right").textContent = `Languages: ${P.languages}`;

/* Dialog (case studies + year details), deep-linkable */
const dlg = $("#dlg");
function openCase(id){
  const c = P.cases.find(x => x.id === id); if (!c) return false;
  $("#dlg-head").innerHTML = `<span class="tag">${esc(c.from)}</span><h2 id="dlg-title">${esc(c.title)}</h2><p>${esc(c.meta)}</p>`;
  $("#dlg-body").innerHTML = `<section><h3>Problem</h3><p>${esc(c.problem)}</p></section>
    <section><h3>What I did</h3><ul>${c.did.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></section>
    <section><h3>Result</h3><p>${esc(c.result)}</p></section>
    <div class="dlg-tags">${c.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
    <p style="font-size:13px;color:var(--muted)">Client code is proprietary. Happy to walk through the decisions in an interview.</p>`;
  show("#" + id); return true;
}
function openYear(y){
  const yr = P.years.find(v => v.year === y); if (!yr) return;
  const roles = P.roles.filter(r => r.years.includes(y));
  $("#dlg-head").innerHTML = `<span class="tag">${yr.g+yr.r} months</span><h2 id="dlg-title">${esc(y)}</h2><p>${esc(yr.note)}</p>`;
  $("#dlg-body").innerHTML = roles.map(r => `<section><h3>${esc(r.when)}</h3><p style="font-weight:700">${esc(r.title)}</p>
    <p style="color:var(--muted);margin-bottom:8px">${esc(r.org)}</p><ul>${r.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></section>`).join("");
  show("#year-" + y);
}
function show(hash){ if (location.hash !== hash) history.pushState(null, "", hash); if (!dlg.open) dlg.showModal(); dlg.querySelector(".dlg-body").scrollTop = 0; }
function closeDlg(){ if (dlg.open) dlg.close(); }
dlg.addEventListener("close", () => { if (location.hash) history.pushState(null, "", location.pathname + location.search); });
$("#dlg-x").onclick = closeDlg;
dlg.addEventListener("click", e => { if (e.target === dlg) closeDlg(); });
document.addEventListener("click", e => {
  const c = e.target.closest("[data-case]"); if (c) return openCase(c.dataset.case);
  const b = e.target.closest("[data-year]"); if (b) return openYear(b.dataset.year);
});
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return closeDlg();
  if (h.startsWith("year-")) return openYear(h.slice(5));
  if (!openCase(h)) closeDlg();
}
window.addEventListener("popstate", route); route();


/* ============ Motion wiring ============ */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el){
  const raw = el.textContent.trim(), m = raw.match(/^(\d+)(.*)$/); if (!m) return;
  const end = +m[1], suf = m[2], dur = 1100, t0 = performance.now();
  const step = t => { const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3);
    el.textContent = Math.round(end*e) + suf; if (k<1) requestAnimationFrame(step); };
  el.textContent = "0" + suf; requestAnimationFrame(step);
}
const tiles = [...document.querySelectorAll(".board .tile")];
const firstFold = innerHeight;
tiles.forEach((t,i) => { if (t.getBoundingClientRect().top < firstFold) t.style.setProperty("--d", (i*70)+"ms"); });
function reveal(t){
  if (t.classList.contains("in")) return;
  t.classList.add("in");
  if (!reduce && t.classList.contains("now")) t.querySelectorAll(".row b").forEach(countUp);
}
if (reduce || !("IntersectionObserver" in window)) tiles.forEach(reveal);
else {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ reveal(e.target); io.unobserve(e.target); } }), {threshold:.18});
  tiles.forEach(t => io.observe(t));
}

/* Theme */
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch {}
$("#theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch {}
};
</script>
